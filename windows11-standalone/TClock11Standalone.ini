; Windows 11 standalone compatibility prototype. Safe to edit with Notepad.
; Use ASCII-only format tokens; Japanese day-of-week names are generated automatically.
[Clock]
; Supported: yyyy, yy, mm, m, dd, ddd (Japanese weekday), dddd, hh, h, nn, n, ss, s, \n
Format=yyyy/mm/dd ddd\nhh:nn:ss

[Placement]
; Measured in device pixels. ShiftX/ShiftY are additional offsets.
Width=156
Height=42
EdgeInset=10
ShiftX=0
ShiftY=0
ShowInFullscreen=0

[Appearance]
Font=Yu Gothic UI
FontSize=11
Bold=0
Foreground=#FFFFFF
Background=#232323
Meter=#6ECD7E

[Statistics]
CPU=1
Memory=0
Network=0
CPUBar=1

[Compatibility]
; Optional: read [Format] Format from the original TClock-Win10 INI file.
; Note: NOT all original TClock tokens and special markup are supported.
UseOriginalFormat=0
OriginalIni=tclock-win10.ini
